# Render Blueprint: Render → New → Blueprint → pick this repo.
#   lark-redis      Redis (Key Value): Celery broker, customers, conversation cache, reminders
#   lark-backend    API (FastAPI) + Lark long connection          python -m app.main
#   lark-celery     Celery worker with Beat built in (reminders)  celery ... worker -B
#   lark-flower     Flower: web page to watch Celery tasks        (free plan)
#   lark-dashboard  static dashboard (optional; you can host it on Cloudflare Pages instead)
# Values marked "sync: false" are asked for once when you create the Blueprint.

envVarGroups:
  - name: lark-shared
    envVars:
      - key: LARK_APP_ID
        sync: false
      - key: LARK_APP_SECRET
        sync: false
      - key: LARK_DOMAIN
        value: lark
      - key: AGENT_API_KEY
        generateValue: true
      - key: MODEL_API_KEY
        sync: false
      - key: MODEL_API_URL
        value: https://api.groq.com/openai/v1/chat/completions
      - key: MODEL_NAME
        value: openai/gpt-oss-120b
      - key: PRODUCT_NAME
        value: leather products
      - key: STANDARD_UNIT_PRICE
        value: "250"
      - key: BULK_MINIMUM_QUANTITY
        value: "500"
      - key: MINIMUM_UNIT_PRICE
        value: "225"
      # Better Stack: one Logs source per stream (Sources → Connect source → Python).
      # Leave a pair empty to keep that stream in Render's log view only.
      - key: BETTERSTACK_APP_TOKEN
        sync: false
      - key: BETTERSTACK_APP_HOST
        sync: false
      - key: BETTERSTACK_CELERY_TOKEN
        sync: false
      - key: BETTERSTACK_CELERY_HOST
        sync: false
      - key: BETTERSTACK_REDIS_TOKEN
        sync: false
      - key: BETTERSTACK_REDIS_HOST
        sync: false
      - key: BETTERSTACK_SERVER_TOKEN
        sync: false
      - key: BETTERSTACK_SERVER_HOST
        sync: false
      - key: BETTERSTACK_ERRORS_DSN
        sync: false

services:
  # ---- Redis ----
  - type: keyvalue
    name: lark-redis
    # Starter or higher: the free plan keeps no data on disk (reminders and customers would be lost).
    plan: starter
    region: singapore # all services must be in the same region
    maxmemoryPolicy: noeviction # Celery tasks must never be evicted
    ipAllowList: [] # only reachable from your Render services

  # ---- API + Lark long connection ----
  - type: web
    name: lark-backend
    runtime: python
    rootDir: backend
    # Starter or higher: free instances sleep after 15 min, which drops the Lark connection.
    plan: starter
    region: singapore
    numInstances: 1 # only ONE copy may hold the Lark long connection
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.main
    healthCheckPath: /health
    # Only needed once: imports customers.json from the old Node version into Redis.
    disk:
      name: lark-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - fromGroup: lark-shared
      - key: DATA_DIR
        value: /data
      - key: REDIS_URL
        fromService: { type: keyvalue, name: lark-redis, property: connectionString }
      # Dashboard URL, e.g. https://lark-dashboard.pages.dev (no trailing slash)
      - key: CORS_ORIGINS
        sync: false

  # ---- Celery worker + Beat ----
  - type: worker
    name: lark-celery
    runtime: python
    rootDir: backend
    plan: starter
    region: singapore
    numInstances: 1 # Beat runs inside this worker: keep ONE instance
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.celery_app worker -B --loglevel=INFO --concurrency=2 --schedule=/tmp/celerybeat-schedule
    envVars:
      - fromGroup: lark-shared
      - key: REDIS_URL
        fromService: { type: keyvalue, name: lark-redis, property: connectionString }

  # ---- Flower (watch Celery) ----
  - type: web
    name: lark-flower
    runtime: python
    rootDir: backend
    plan: free # sleeps when unused; that's fine for a monitoring page
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.celery_app flower --address=0.0.0.0 --port=$PORT --basic-auth=admin:$FLOWER_PASSWORD
    envVars:
      - key: FLOWER_PASSWORD
        generateValue: true
      - key: REDIS_URL
        fromService: { type: keyvalue, name: lark-redis, property: connectionString }

  # ---- Dashboard (static) ----
  - type: web
    name: lark-dashboard
    runtime: static
    rootDir: frontend
    buildCommand: npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /config.js
        name: Cache-Control
        value: no-cache
    envVars:
      # Backend URL, e.g. https://lark-backend.onrender.com
      - key: API_URL
        sync: false
      - key: BETTERSTACK_SOURCE_TOKEN
        sync: false
      - key: BETTERSTACK_HOST
        sync: false
