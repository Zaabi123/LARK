# Render Blueprint: Render → New → Blueprint → pick this repo.
# Free plans only:
#   lark-redis      Redis (Key Value): Celery broker, customers, conversation cache, reminders
#   lark-backend    API (FastAPI) + Lark long connection + Celery worker/Beat   python -m app.main
#   lark-flower     Flower: web page to watch Celery tasks
# The dashboard is hosted separately (Vercel / Cloudflare Pages).
# Values marked "sync: false" are asked for once when you create the Blueprint.

envVarGroups:
  - name: lark-shared
    envVars:
      - key: LARK_APP_ID
        sync: false
      - key: LARK_APP_SECRET
        sync: false
      - key: LARK_DOMAIN
        value: lark
      - key: AGENT_API_KEY
        generateValue: true
      - key: MODEL_API_KEY
        sync: false
      - key: MODEL_API_URL
        value: https://api.groq.com/openai/v1/chat/completions
      - key: MODEL_NAME
        value: openai/gpt-oss-120b
      - key: PRODUCT_NAME
        value: leather products
      - key: STANDARD_UNIT_PRICE
        value: "250"
      - key: BULK_MINIMUM_QUANTITY
        value: "500"
      - key: MINIMUM_UNIT_PRICE
        value: "225"
      # Better Stack: one Logs source per stream (Sources → Connect source → Python).
      # Leave a pair empty to keep that stream in Render's log view only.
      - key: BETTERSTACK_APP_TOKEN
        sync: false
      - key: BETTERSTACK_APP_HOST
        sync: false
      - key: BETTERSTACK_CELERY_TOKEN
        sync: false
      - key: BETTERSTACK_CELERY_HOST
        sync: false
      - key: BETTERSTACK_REDIS_TOKEN
        sync: false
      - key: BETTERSTACK_REDIS_HOST
        sync: false
      - key: BETTERSTACK_SERVER_TOKEN
        sync: false
      - key: BETTERSTACK_SERVER_HOST
        sync: false
      - key: BETTERSTACK_ERRORS_DSN
        sync: false

services:
  # ---- Redis ----
  - type: keyvalue
    name: lark-redis
    # Free: no data on disk, so customers/reminders are lost if Redis restarts (Starter keeps them).
    plan: free
    region: singapore # all services must be in the same region
    maxmemoryPolicy: noeviction # Celery tasks must never be evicted
    ipAllowList: [] # only reachable from your Render services

  # ---- API + Lark long connection + Celery worker/Beat (child processes) ----
  - type: web
    name: lark-backend
    runtime: python
    rootDir: backend
    # Free: sleeps after 15 min without HTTP traffic, which also stops the Lark connection
    # and Celery until the next request wakes it (Starter stays awake).
    plan: free
    region: singapore
    numInstances: 1 # only ONE copy may hold the Lark long connection
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.main
    healthCheckPath: /health
    envVars:
      - fromGroup: lark-shared
      - key: CELERY_IN_WEB
        value: "on"
      - key: REDIS_URL
        fromService: { type: keyvalue, name: lark-redis, property: connectionString }
      # Dashboard URL, e.g. https://lark-dashboard.pages.dev (no trailing slash)
      - key: CORS_ORIGINS
        sync: false

  # ---- Flower (watch Celery) ----
  - type: web
    name: lark-flower
    runtime: python
    rootDir: backend
    plan: free # sleeps when unused; that's fine for a monitoring page
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.celery_app flower --address=0.0.0.0 --port=$PORT --basic-auth=admin:$FLOWER_PASSWORD
    envVars:
      - key: FLOWER_PASSWORD
        generateValue: true
      - key: REDIS_URL
        fromService: { type: keyvalue, name: lark-redis, property: connectionString }
